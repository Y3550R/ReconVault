<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Organization Management — ReconVault</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/variables.css" rel="stylesheet">
    <link href="/css/base.css" rel="stylesheet">
    <link href="/css/components.css" rel="stylesheet">
    <link href="/css/layout.css" rel="stylesheet">
</head>
<body>
    <header id="app-header" class="app-header"></header>

    <main class="app-content container-fluid">
        <div class="page-heading">
            <div>
                <h1 class="h3">Organization Management</h1>
                <p>Manage client organizations and their contact information.</p>
            </div>
            <button class="btn btn-success" id="show-create-organization">
                Create Organization
            </button>
        </div>

        <section class="panel mb-4" id="organization-form-panel" hidden>
            <h2 class="h5 mb-3" id="organization-form-title">
                Create Organization
            </h2>

            <form id="organization-form">
                <input type="hidden" id="organization-id">

                <div class="mb-3">
                    <label for="organization-name" class="form-label">
                        Organization Name
                    </label>
                    <input
                        class="form-control"
                        id="organization-name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="contact-information" class="form-label">
                        Contact Information
                    </label>
                    <textarea
                        class="form-control"
                        id="contact-information"
                        rows="3"
                    ></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-success" type="submit">
                        Save Organization
                    </button>
                    <button class="btn btn-outline-secondary" type="button" id="cancel-organization">
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
                <h2 class="h5 mb-0">Organizations</h2>
                <input
                    class="form-control"
                    id="organization-search"
                    placeholder="Search organizations..."
                    aria-label="Search organizations"
                    style="max-width: 300px"
                >
            </div>

            <div id="organization-message" role="status" aria-live="polite"></div>
            <div id="organization-table-container">
                <p class="text-muted">Loading organizations...</p>
            </div>
        </section>
    </main>

    <script type="module" src="/js/pages/admin-organizations.js"></script>
</body>
</html>
