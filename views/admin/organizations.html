<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Organization Management | ReconVault</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>

<body>
    <div class="app-shell">
        <header id="app-header" class="app-header"></header>

        <main class="app-content" id="main-content" tabindex="-1">
            <div class="page-heading">
                <div>
                    <h1>Organization Management</h1>
                    <p>Manage client organizations and their contact information.</p>
                </div>
                <button class="btn btn-primary" id="show-create-organization" type="button">
                    Create organization
                </button>
            </div>

            <section class="panel panel--spaced" id="organization-form-panel" hidden
                aria-labelledby="organization-form-title">
                <div class="panel-header">
                    <h2 id="organization-form-title">Create organization</h2>
                </div>

                <form id="organization-form">
                    <div class="panel-body">
                        <input type="hidden" id="organization-id">

                        <div class="row g-3">
                            <div class="col-12">
                                <label for="organization-name" class="form-label">
                                    Organization name
                                </label>
                                <input class="form-control" id="organization-name" required>
                            </div>

                            <div class="col-12">
                                <label for="contact-information" class="form-label">
                                    Contact information
                                </label>
                                <textarea class="form-control" id="contact-information" rows="3"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="panel-footer">
                        <button class="btn btn-outline-secondary" type="button" id="cancel-organization">
                            Cancel
                        </button>
                        <button class="btn btn-primary" type="submit">
                            Save organization
                        </button>
                    </div>
                </form>
            </section>

            <section class="panel" aria-labelledby="organization-list-title">
                <div class="panel-header">
                    <div>
                        <h2 id="organization-list-title">Organizations</h2>
                        <p>All client organizations registered in ReconVault.</p>
                    </div>
                    <input class="form-control search-input" id="organization-search" type="search"
                        placeholder="Search organizations…" aria-label="Search organizations">
                </div>

                <div id="organization-message" role="status" aria-live="polite"></div>
                <div id="organization-table-container">
                    <p class="panel-message">Loading organizations…</p>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="/js/pages/admin-organizations.js"></script>
</body>

</html>
