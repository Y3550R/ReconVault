<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Management | ReconVault</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>

<body>
    <div class="app-shell">
        <header id="app-header" class="app-header"></header>

        <main class="app-content" id="main-content" tabindex="-1">
            <div class="page-heading">
                <div>
                    <h1>User Management</h1>
                    <p>Manage user accounts, roles, and client organizations.</p>
                </div>
                <button class="btn btn-primary" id="show-create-user" type="button">
                    Create user
                </button>
            </div>

            <section class="panel panel--spaced" id="user-form-panel" hidden aria-labelledby="user-form-title">
                <div class="panel-header">
                    <h2 id="user-form-title">Create user</h2>
                </div>

                <form id="user-form">
                    <div class="panel-body">
                        <input type="hidden" id="user-id">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="username" class="form-label">Username</label>
                                <input class="form-control" id="username" required>
                            </div>

                            <div class="col-md-6">
                                <label for="password" class="form-label">Password</label>
                                <input class="form-control" id="password" type="password"
                                    autocomplete="new-password">
                                <div class="form-text">
                                    Required when creating a user; leave blank to keep the existing password.
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="user-status" class="form-label">Status</label>
                                <select class="form-select" id="user-status" required>
                                    <option value="ACTIVE">Active</option>
                                    <option value="INACTIVE">Inactive</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <fieldset>
                                    <legend class="form-label">Roles</legend>
                                    <div class="d-flex flex-wrap gap-3">
                                        <div class="form-check">
                                            <input class="form-check-input user-role-checkbox" type="checkbox"
                                                value="admin" id="role-admin">
                                            <label class="form-check-label" for="role-admin">
                                                Administrator
                                            </label>
                                        </div>

                                        <div class="form-check">
                                            <input class="form-check-input user-role-checkbox" type="checkbox"
                                                value="pentester" id="role-pentester">
                                            <label class="form-check-label" for="role-pentester">
                                                Pentester
                                            </label>
                                        </div>

                                        <div class="form-check">
                                            <input class="form-check-input user-role-checkbox" type="checkbox"
                                                value="client" id="role-client">
                                            <label class="form-check-label" for="role-client">
                                                Client
                                            </label>
                                        </div>
                                    </div>
                                    <div id="user-roles-error" class="text-danger small mt-1"></div>
                                </fieldset>
                            </div>

                            <div class="col-12" id="user-organization-section" hidden>
                                <label for="organization-select" class="form-label">
                                    Client organization
                                </label>
                                <select class="form-select" id="organization-select">
                                    <option value="">Select organization</option>
                                </select>
                                <div id="organization-error" class="text-danger small mt-1"></div>
                            </div>
                        </div>

                        <div id="user-form-message" role="status" aria-live="polite"></div>
                    </div>

                    <div class="panel-footer">
                        <button class="btn btn-outline-secondary" type="button" id="cancel-user">
                            Cancel
                        </button>
                        <button class="btn btn-primary" type="submit" id="save-user">
                            Save user
                        </button>
                    </div>
                </form>
            </section>

            <section class="panel" aria-labelledby="user-list-title">
                <div class="panel-header">
                    <div>
                        <h2 id="user-list-title">Users</h2>
                        <p>All accounts registered in ReconVault.</p>
                    </div>
                    <input class="form-control search-input" id="user-search" type="search"
                        placeholder="Search username…" aria-label="Search users">
                </div>

                <div id="user-message" role="status" aria-live="polite"></div>
                <div id="user-table-container">
                    <p class="panel-message">Loading users…</p>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="/js/pages/admin-users.js"></script>
</body>

</html>
