<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Engagement Findings | ReconVault</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/variables.css" rel="stylesheet">
    <link href="/css/base.css" rel="stylesheet">
    <link href="/css/components.css" rel="stylesheet">
    <link href="/css/layout.css" rel="stylesheet">
    <link href="/css/engagement-pages.css" rel="stylesheet">
    <link href="/css/findings.css" rel="stylesheet">
</head>

<body>
    <div class="app-shell">
        <header id="app-header" class="app-header"></header>

        <nav class="rv-engagement-subnav" data-engagement-subnav aria-label="Engagement navigation"></nav>

        <main class="app-content findings-page" id="main-content" tabindex="-1">
            <div class="page-heading findings-heading">
                <div>
                    <h1>Findings</h1>
                    <p>Security issues identified during this engagement.</p>
                </div>

                <button id="create-finding-button" class="btn btn-primary" type="button" hidden>
                    Create finding
                </button>
            </div>

            <div id="findings-alert" class="alert d-none" role="alert"></div>

            <section id="finding-form-panel" class="panel finding-form-panel" aria-labelledby="finding-form-title"
                hidden>
                <div class="panel-header finding-section-header">
                    <div>
                        <h2 id="finding-form-title">Create finding</h2>
                        <p>Document the issue and link affected assets.</p>
                    </div>

                    <button id="cancel-finding-form" class="btn btn-outline-secondary rv-button" type="button">
                        Cancel
                    </button>
                </div>

                <form id="finding-form">
                    <div class="finding-form-body">
                        <div id="finding-form-alert" class="alert d-none" role="alert"></div>

                        <div class="row g-3">
                            <div class="col-12">
                                <label for="finding-title" class="form-label">Title *</label>
                                <input id="finding-title" name="title" class="form-control" type="text" maxlength="200"
                                    required>
                            </div>

                            <div class="col-md-6">
                                <label for="finding-severity" class="form-label">Severity *</label>
                                <select id="finding-severity" name="severity" class="form-select" required>
                                    <option value="CRITICAL">Critical</option>
                                    <option value="HIGH">High</option>
                                    <option value="MEDIUM" selected>Medium</option>
                                    <option value="LOW">Low</option>
                                    <option value="INFO">Informational</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="finding-status" class="form-label">Status</label>
                                <select id="finding-status" name="status" class="form-select">
                                    <option value="OPEN">Open</option>
                                    <option value="IN PROGRESS">In progress</option>
                                    <option value="RESOLVED">Resolved</option>
                                    <option value="ACCEPTED">Accepted</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="finding-description" class="form-label">Description *</label>
                                <textarea id="finding-description" name="description" class="form-control" rows="5"
                                    maxlength="5000" required></textarea>
                            </div>

                            <div class="col-md-6">
                                <label for="finding-cvss" class="form-label">CVSS vector</label>
                                <input id="finding-cvss" name="cvss_vector" class="form-control" type="text"
                                    maxlength="100" placeholder="CVSS:3.1/AV:N/...">
                            </div>

                            <div class="col-md-6">
                                <label for="finding-references" class="form-label">References</label>
                                <textarea id="finding-references" name="references" class="form-control" rows="3"
                                    maxlength="2000" placeholder="URLs or reference identifiers"></textarea>
                            </div>

                            <div class="col-12">
                                <label for="finding-remediation" class="form-label">Remediation</label>
                                <textarea id="finding-remediation" name="remediation" class="form-control" rows="4"
                                    maxlength="5000"></textarea>
                            </div>

                            <div class="col-12">
                                <fieldset class="asset-fieldset">
                                    <legend class="form-label">Affected targets</legend>
                                    <p class="text-muted">Select at least one target or service.</p>

                                    <div id="finding-target-options" class="asset-options">
                                        <span class="text-muted">Loading targets...</span>
                                    </div>
                                </fieldset>
                            </div>

                            <div class="col-12">
                                <fieldset class="asset-fieldset">
                                    <legend class="form-label">Affected services</legend>

                                    <div id="finding-service-options" class="asset-options">
                                        <span class="text-muted">Loading services...</span>
                                    </div>
                                </fieldset>
                            </div>
                        </div>
                    </div>

                    <div class="finding-form-footer">
                        <button id="cancel-finding-form-bottom" type="button"
                            class="btn btn-outline-secondary rv-button">
                            Cancel
                        </button>

                        <button id="save-finding-button" type="submit" class="btn btn-primary">
                            Save finding
                        </button>
                    </div>
                </form>
            </section>

            <section class="panel findings-list-panel" aria-labelledby="findings-list-title">
                <div class="panel-header findings-section-header">
                    <div>
                        <h2 id="findings-list-title">Recorded findings</h2>
                        <p id="findings-count">Loading findings...</p>
                    </div>

                    <button id="refresh-findings-button" class="btn btn-outline-secondary rv-button" type="button">
                        Refresh
                    </button>
                </div>

                <div id="findings-content" aria-live="polite" aria-busy="false">
                    <div class="findings-empty">Loading findings...</div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/engagement-subnav.js"></script>
    <script type="module" src="/js/pages/findings.js"></script>
</body>

</html>
