<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Engagement Targets | ReconVault</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/variables.css" rel="stylesheet">
    <link href="/css/base.css" rel="stylesheet">
    <link href="/css/components.css" rel="stylesheet">
    <link href="/css/layout.css" rel="stylesheet">
    <link href="/css/engagement-pages.css" rel="stylesheet">
    <link href="/css/targets.css" rel="stylesheet">
</head>

<body>
    <div class="app-shell">

        <header id="app-header" class="app-header"></header>

        <main class="app-content targets-page" id="main-content" tabindex="-1">
            <div class="page-heading targets-heading">
                <div>
                    <h1>Targets</h1>
                    <p>Manage the systems included in this engagement.</p>
                </div>
                <div class="d-flex gap-2">
                    <button id="refresh-targets" class="btn btn-outline-secondary rv-button" type="button">
                        Refresh
                    </button>
                    <button id="create-target" class="btn btn-primary" type="button" hidden>
                        Create target
                    </button>
                </div>
            </div>

            <div id="targets-alert" class="alert d-none" role="alert"></div>

            <section id="target-form-panel" class="panel target-form-panel" hidden aria-labelledby="target-form-title">
                <div class="panel-header">
                    <h2 id="target-form-title">Create target</h2>
                </div>

                <form id="target-form">
                    <div class="target-form-body">
                        <div id="target-form-alert" class="alert d-none" role="alert"></div>

                        <div class="row g-3">
                            <div class="col-md-8">
                                <label for="target-ip-address" class="form-label">IP address *</label>
                                <input id="target-ip-address" name="ip_address" class="form-control" required
                                    maxlength="45" autocomplete="off">
                            </div>

                            <div class="col-md-4">
                                <label for="target-ip-type" class="form-label">IP type *</label>
                                <select id="target-ip-type" name="ip_type" class="form-select" required>
                                    <option value="IPV4">IPv4</option>
                                    <option value="IPV6">IPv6</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="target-hostname" class="form-label">Hostname</label>
                                <input id="target-hostname" name="hostname" class="form-control" maxlength="255">
                            </div>

                            <div class="col-md-6">
                                <label for="target-domain" class="form-label">Domain name</label>
                                <input id="target-domain" name="domain_name" class="form-control" maxlength="255">
                            </div>

                            <div class="col-md-6">
                                <label for="target-os" class="form-label">Operating system</label>
                                <input id="target-os" name="operating_system" class="form-control" maxlength="255">
                            </div>

                            <div class="col-md-6">
                                <label for="target-status" class="form-label">Status</label>
                                <select id="target-status" name="status" class="form-select">
                                    <option value="ACTIVE">Active</option>
                                    <option value="INACTIVE">Inactive</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="target-description" class="form-label">Description</label>
                                <textarea id="target-description" name="description" class="form-control"
                                    rows="3"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="target-form-footer">
                        <button id="cancel-target" type="button"
                            class="btn btn-outline-secondary rv-button">Cancel</button>
                        <button id="save-target" type="submit" class="btn btn-primary">
                            Create target
                        </button>
                    </div>
                </form>
            </section>


            <section class="panel targets-panel" aria-label="Engagement targets">
                <div id="targets-content" aria-live="polite" aria-busy="false">
                    <div class="targets-empty">Loading targets...</div>
                </div>
            </section>
        </main>

    </div>

    <script type="module" src="/js/engagement-subnav.js"></script>
    <script type="module" src="/js/pages/targets.js"></script>
</body>

</html>
